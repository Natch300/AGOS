<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>AGOS — Reset Password</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.0/css/all.min.css" />
  <link rel="stylesheet" href="css/variables.css" />
  <link rel="stylesheet" href="css/global.css" />
  <link rel="stylesheet" href="css/login.css" />
</head>
<body class="login-body">
  <div class="login-wrapper">
    <div class="login-brand" aria-hidden="true">
      <div class="brand-content">
        <div class="brand-logo"><i class="fas fa-water"></i></div>
        <h1 class="brand-name">AGOS</h1>
        <p class="brand-tagline">Your money flows with you.</p>
      </div>
    </div>
    <main class="login-form-panel">
      <div class="login-form-inner">
        <h2 style="margin-bottom:var(--space-4)">Reset Password</h2>
        <p style="color:var(--text-muted);margin-bottom:var(--space-5);font-size:var(--font-size-sm)">
          Enter your new password below.
        </p>
        <div class="form-group">
          <label class="form-label" for="new-password">New Password</label>
          <input type="password" id="new-password" class="form-control" placeholder="At least 8 characters" autocomplete="new-password" />
        </div>
        <div class="form-group">
          <label class="form-label" for="confirm-password">Confirm Password</label>
          <input type="password" id="confirm-password" class="form-control" placeholder="Repeat new password" autocomplete="new-password" />
        </div>
        <div id="reset-error" class="form-error hidden" role="alert"></div>
        <button type="button" class="btn btn-primary btn-full btn-lg" id="btn-reset" style="margin-top:var(--space-4)">Update Password</button>
        <a href="index.html" class="link-btn" style="display:inline-block;margin-top:var(--space-3)">← Back to Sign In</a>
      </div>
    </main>
  </div>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.112.3/dist/umd/supabase.min.js"></script>
  <script>
    const SUPABASE_URL      = 'https://fjmbzvfoxntmolxdfdzy.supabase.co';
    const SUPABASE_ANON_KEY = 'sb_publishable_U01UUqfNsehy9rxnjI2Q6Q_lbOBEQuB';
    const sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY, {
      auth: { persistSession: true, autoRefreshToken: true, storageKey: 'agos-session' }
    });

    function showErr(id, msg) {
      const el = document.getElementById(id);
      el.textContent = msg;
      el.classList.remove('hidden');
    }
    function hideErr(id) {
      const el = document.getElementById(id);
      el.textContent = '';
      el.classList.add('hidden');
    }

    document.getElementById('btn-reset').addEventListener('click', async () => {
      hideErr('reset-error');
      const pw = document.getElementById('new-password').value;
      const confirm = document.getElementById('confirm-password').value;

      if (!pw || pw.length < 8) { showErr('reset-error', 'Password must be at least 8 characters.'); return; }
      if (pw !== confirm) { showErr('reset-error', 'Passwords do not match.'); return; }

      const btn = document.getElementById('btn-reset');
      btn.disabled = true;
      btn.textContent = 'Updating…';

      try {
        const { error } = await sb.auth.updateUser({ password: pw });
        if (error) { showErr('reset-error', error.message); btn.disabled = false; btn.textContent = 'Update Password'; return; }
        window.location.href = 'index.html';
      } catch (e) {
        showErr('reset-error', 'Something went wrong. Please try again.');
        btn.disabled = false;
        btn.textContent = 'Update Password';
      }
    });
  </script>
</body>
</html>
