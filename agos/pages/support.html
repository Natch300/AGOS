<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>AGOS — Help & Support</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.0/css/all.min.css" />
  <link rel="stylesheet" href="../css/variables.css" />
  <link rel="stylesheet" href="../css/global.css" />
</head>
<body>
<div class="app-shell">
  <aside id="sidebar" class="sidebar"></aside>
  <div class="main-content">
    <header id="top-header" class="top-header"></header>
    <main class="page-body">
      <div style="max-width:680px">

        <!-- Call support button (always visible) -->
        <div class="card support-hero" style="margin-bottom:var(--space-5)">
          <div style="display:flex;align-items:center;gap:var(--space-5);flex-wrap:wrap">
            <div style="flex:1;min-width:200px">
              <h2 style="font-size:var(--font-size-xl);margin-bottom:var(--space-2)">Need Help?</h2>
              <p style="color:var(--text-muted);font-size:var(--font-size-sm)">
                Our support team is available <strong>Monday to Saturday, 8AM to 6PM</strong>.
              </p>
            </div>
            <a href="tel:+6328001234" class="btn btn-success btn-lg" aria-label="Call support at 1800-AGOS">
              <i class="fas fa-phone" aria-hidden="true"></i> Call Support
            </a>
          </div>
        </div>

        <!-- New ticket form -->
        <div class="card" style="margin-bottom:var(--space-5)">
          <h2 style="margin-bottom:var(--space-2)">Submit a Support Request</h2>
          <p style="font-size:var(--font-size-sm);color:var(--text-muted);margin-bottom:var(--space-5)">
            Describe your issue and we'll get back to you as soon as possible.
          </p>
          <div class="form-group">
            <label class="form-label" for="ticket-subject">Subject</label>
            <input type="text" id="ticket-subject" class="form-control"
                   placeholder="e.g. Problem with my transfer" maxlength="120" />
          </div>
          <div class="form-group">
            <label class="form-label" for="ticket-priority">Priority</label>
            <select id="ticket-priority" class="form-control">
              <option value="low">Low — General question</option>
              <option value="normal" selected>Normal — I need help with something</option>
              <option value="high">High — Account or transaction issue</option>
              <option value="urgent">Urgent — Suspicious activity or account locked</option>
            </select>
          </div>
          <div class="form-group">
            <label class="form-label" for="ticket-body">Details</label>
            <textarea id="ticket-body" class="form-control" placeholder="Please describe your issue in detail. Include any reference numbers if applicable."
                      rows="5" maxlength="2000"></textarea>
          </div>
          <div id="ticket-error" class="form-error hidden" role="alert"></div>
          <button class="btn btn-primary btn-lg" id="btn-submit-ticket">Submit Request</button>
        </div>

        <!-- Ticket history -->
        <div class="card">
          <div class="card-header">
            <h2 class="card-title">My Support Tickets</h2>
          </div>
          <div id="tickets-list">
            <div class="spinner"></div>
          </div>
        </div>

      </div>
    </main>
  </div>
</div>

<!-- Ticket detail modal -->
<div id="ticket-modal" class="modal-backdrop hidden" role="dialog" aria-modal="true" aria-labelledby="ticket-modal-title">
  <div class="modal" style="max-width:600px">
    <div class="modal-header">
      <h3 class="modal-title" id="ticket-modal-title">Ticket Details</h3>
      <button class="modal-close" id="ticket-modal-close" aria-label="Close">✕</button>
    </div>
    <div class="modal-body" id="ticket-modal-body"></div>
    <div class="modal-footer">
      <button class="btn btn-ghost" id="ticket-modal-close2">Close</button>
    </div>
  </div>
</div>

<style>
.support-hero { background:var(--color-info-bg);border-left:4px solid var(--color-info); }
.ticket-item { padding:var(--space-5);border-bottom:1px solid var(--border-color);cursor:pointer;transition:background var(--transition-fast); }
.ticket-item:hover { background:var(--color-gray-50); }
.ticket-item:last-child { border-bottom:none; }
.ticket-head { display:flex;align-items:flex-start;justify-content:space-between;gap:var(--space-3);margin-bottom:var(--space-2); }
.ticket-subject { font-weight:700;font-size:var(--font-size-sm);flex:1; }
.ticket-preview { font-size:var(--font-size-sm);color:var(--text-muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis; }
.ticket-meta { display:flex;align-items:center;gap:var(--space-3);margin-top:var(--space-2); }
.ticket-date { font-size:var(--font-size-xs);color:var(--text-muted); }
.priority-badge-low    { background:#f0f9ff;color:#0369a1; }
.priority-badge-normal { background:var(--color-info-bg);color:var(--color-info); }
.priority-badge-high   { background:var(--color-warning-bg);color:var(--color-warning); }
.priority-badge-urgent { background:var(--color-danger-bg);color:var(--color-danger); }
</style>
<nav id="mobile-nav" class="mobile-nav" aria-label="Mobile navigation"></nav>
<script type="module" src="../js/pages/support.js"></script>
</body>
</html>
