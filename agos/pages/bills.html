<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>AGOS — Pay Bills</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.0/css/all.min.css" />
  <link rel="stylesheet" href="../css/variables.css" />
  <link rel="stylesheet" href="../css/global.css" />
</head>
<body>
<div class="app-shell">
  <aside id="sidebar" class="sidebar"></aside>
  <div class="main-content">
    <header id="top-header" class="top-header"></header>
    <main class="page-body">
      <div style="max-width:640px">

        <!-- Step 1: Choose biller -->
        <div id="step-1">
          <div class="card" style="margin-bottom:var(--space-5)">
            <h2 style="margin-bottom:var(--space-2)">Pay Bills</h2>
            <p style="font-size:var(--font-size-sm);color:var(--text-muted);margin-bottom:var(--space-5)">
              Select a biller to pay directly from your AGOS account.
            </p>

            <div class="form-group">
              <label class="form-label" for="biller-search">Search Biller</label>
              <input type="search" id="biller-search" class="form-control" placeholder="e.g. Meralco, Globe..." />
            </div>

            <div class="biller-categories" id="biller-categories" aria-label="Biller categories"></div>
            <div class="biller-grid" id="biller-grid" role="list" aria-label="Available billers">
              <div class="spinner"></div>
            </div>
          </div>
        </div>

        <!-- Step 2: Bill details -->
        <div id="step-2" class="hidden">
          <div class="card">
            <button class="btn btn-ghost btn-sm" id="btn-back-step1" style="margin-bottom:var(--space-4)">← Back to Billers</button>
            <div class="selected-biller" id="selected-biller-header"></div>

            <div class="form-group" style="margin-top:var(--space-5)">
              <label class="form-label" for="bill-acct">Account / Reference Number</label>
              <input type="text" id="bill-acct" class="form-control"
                     placeholder="Enter your account number with this biller" />
              <p class="form-hint">This is the account number on your bill statement</p>
            </div>
            <div class="form-group">
              <label class="form-label" for="bill-amount">Amount to Pay (PHP)</label>
              <div style="position:relative">
                <span style="position:absolute;left:16px;top:50%;transform:translateY(-50%);font-size:var(--font-size-lg);font-weight:700;color:var(--text-muted)">₱</span>
                <input type="number" id="bill-amount" class="form-control" placeholder="0.00"
                       min="1" step="0.01" style="padding-left:40px;font-size:var(--font-size-xl);font-weight:700" inputmode="decimal" />
              </div>
              <p class="form-hint">Available balance: <strong id="bill-avail-bal"></strong></p>
            </div>
            <div class="form-group">
              <label class="form-label" for="bill-note">Note (optional)</label>
              <input type="text" id="bill-note" class="form-control" placeholder="e.g. November bill" maxlength="100" />
            </div>
            <div id="bill-error" class="form-error hidden" role="alert"></div>
            <button class="btn btn-primary btn-full btn-lg" id="btn-pay-review" style="margin-top:var(--space-4)">
              Review Payment →
            </button>
          </div>
        </div>

        <!-- Step 3: Confirm -->
        <div id="step-3" class="hidden">
          <div class="card">
            <h2 style="margin-bottom:var(--space-5)">Confirm Payment</h2>
            <div id="bill-confirm-box"></div>
            <div class="alert alert-warning" style="margin-top:var(--space-4)">
              <i class="fas fa-triangle-exclamation" aria-hidden="true"></i> Bill payments cannot be reversed. Please verify all details before confirming.
            </div>
            <div id="confirm-error" class="form-error hidden" role="alert"></div>
            <div style="display:flex;gap:var(--space-3);margin-top:var(--space-5)">
              <button class="btn btn-ghost" id="btn-back-step2">← Edit</button>
              <button class="btn btn-success btn-full btn-lg" id="btn-pay-confirm">Pay Now</button>
            </div>
          </div>
        </div>

        <!-- Step 4: Success -->
        <div id="step-4" class="hidden">
          <div class="card">
            <div id="bill-success" style="text-align:center;padding:var(--space-8) 0"></div>
          </div>
        </div>

      </div>
    </main>
  </div>
</div>
<nav id="mobile-nav" class="mobile-nav" aria-label="Mobile navigation"></nav>
<div class="loading-overlay hidden" id="loading-overlay"></div>
<style>
.biller-categories { display:flex;flex-wrap:wrap;gap:var(--space-2);margin-bottom:var(--space-5); }
.cat-btn { padding:var(--space-2) var(--space-4);border:2px solid var(--border-color);background:var(--bg-card);border-radius:var(--border-radius-full);font-family:var(--font-family);font-size:var(--font-size-xs);font-weight:700;cursor:pointer;transition:all var(--transition-fast);text-transform:uppercase;letter-spacing:.05em; }
.cat-btn.active,.cat-btn:hover { border-color:var(--color-primary);background:var(--color-primary);color:#fff; }
.biller-grid { display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:var(--space-3); }
.biller-card { display:flex;flex-direction:column;align-items:center;gap:var(--space-2);padding:var(--space-4);border:2px solid var(--border-color);background:var(--bg-card);border-radius:var(--border-radius-lg);cursor:pointer;transition:all var(--transition-fast);text-align:center; }
.biller-card:hover { border-color:var(--color-primary);background:var(--color-info-bg); }
.biller-card:focus { outline:3px solid var(--color-primary);outline-offset:2px; }
.biller-icon { font-size:2rem;width:52px;height:52px;background:var(--color-gray-100);border-radius:var(--border-radius-full);display:flex;align-items:center;justify-content:center; }
.biller-name { font-size:var(--font-size-xs);font-weight:700;color:var(--text-primary); }
.biller-cat { font-size:.65rem;color:var(--text-muted);text-transform:uppercase;letter-spacing:.05em; }
.selected-biller { display:flex;align-items:center;gap:var(--space-4);padding:var(--space-4);background:var(--color-info-bg);border-radius:var(--border-radius);border:2px solid #bfdbfe; }
.sel-bil-icon { font-size:2rem;width:52px;height:52px;background:var(--bg-card);border-radius:var(--border-radius-full);display:flex;align-items:center;justify-content:center;flex-shrink:0; }
.sel-bil-name { font-weight:700;font-size:var(--font-size-md); }
.sel-bil-cat { font-size:var(--font-size-xs);color:var(--text-muted);text-transform:capitalize; }
.confirm-row { display:flex;justify-content:space-between;align-items:center;padding:var(--space-4) 0;border-bottom:1px solid var(--border-color); }
.confirm-row:last-child { border-bottom:none; }
.confirm-lbl { color:var(--text-muted);font-size:var(--font-size-sm);font-weight:600; }
.confirm-val { font-weight:700;font-size:var(--font-size-sm);text-align:right; }
.confirm-amount { font-family:var(--font-family-mono);font-variant-numeric:tabular-nums;font-size:var(--font-size-2xl);font-weight:700;color:var(--color-danger);text-align:center;padding:var(--space-4) 0; }
</style>
<script type="module" src="../js/pages/bills.js"></script>
</body>
</html>
